<ion-header class="ion-no-border">
  <ion-toolbar>
    <ion-title class="text-center">Forgot Password</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <div class="container">
    <form (submit)="resetPassword()">
      <ion-label position="stacked">Email</ion-label>
      <ion-input type="email" [(ngModel)]="email" name="email"></ion-input>
      <p>Sila masukkan alamat e-mel yang berdaftar untuk menerima pautan reset kata laluan anda.</p>
      <ion-button type="submit">Hantar Link Reset Kata Laluan</ion-button>
    </form>
  </div>
</ion-content>
