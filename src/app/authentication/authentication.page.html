<ion-header class="ion-no-border">
  <ion-toolbar>
    <ion-title class="ion-text-center">Log Masuk</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding auth-content">
  <div class="auth-container">

    <!-- App Logo (Replace with your actual logo path) -->
    <img src="assets/icon/favicon.png" alt="App Logo" class="auth-logo" />

    <!-- Welcome Text -->
    <h2 class="ion-text-center auth-title">Selamat Datang!</h2>
    <p class="ion-text-center auth-subtitle">Sila log masuk menggunakan akaun Google anda.</p>

    <!-- Google Sign-In Button -->
    <ion-button expand="block" (click)="signInWithGoogle()" [disabled]="isLoading" class="auth-button ion-margin-top">
      <!-- Show spinner when loading -->
      <ion-spinner *ngIf="isLoading" name="crescent" slot="start"></ion-spinner>
      <!-- Show icon and text when not loading -->
      <ion-icon *ngIf="!isLoading" slot="start" name="logo-google"></ion-icon>
      <span *ngIf="!isLoading">Log Masuk dengan Google</span>
      <span *ngIf="isLoading">Memproses...</span>
    </ion-button>

  </div>
</ion-content>
